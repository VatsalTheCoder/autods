[project]
name = "autods"
version = "0.1.0"
description = "Multi-agent autonomous data scientist"
requires-python = ">=3.12"

# Deliberately minimal. Heavy ML dependencies still arrive in the sections that
# need them (Section 5: scikit-learn, Section 8: SHAP). Keeping this small means
# fast Docker builds while you iterate on plumbing.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "pandas>=2.2",
    # Section 2: the Google AI Studio client (unified Google GenAI SDK). Serves
    # both Gemma tiers; embeddings stay separate and land in Section 10.
    "google-genai>=1.0",
    # Section 4: the workflow engine. Introduced now with placeholder nodes so
    # the orchestration is proven before real agents fill it (Section 5+).
    "langgraph>=0.2",
    # Section 5: the modelling stack.
    "scikit-learn>=1.5",
    # imblearn's Pipeline, not sklearn's, from the very first model (spec 8).
    # SMOTE itself only arrives in Section 7, but the pipeline *class* has to be
    # the one that can hold a resampler inside a CV fold -- adopting it now means
    # that section inserts a step rather than rewriting how every model is
    # trained, and there is never a window where resampling sits outside the fold.
    "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "C4",   # comprehension simplifications
]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults, which is normally a real bug.
# FastAPI's dependency injection is built on exactly that pattern, so these
# specific calls are exempted rather than the rule being disabled everywhere.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
