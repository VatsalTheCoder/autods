[project]
name = "autods"
version = "0.1.0"
description = "Multi-agent autonomous data scientist"
requires-python = ">=3.12"

# Deliberately minimal. ML and LLM dependencies arrive in the sections that
# need them (Section 2: LLM client, Section 5: scikit-learn, Section 8: SHAP).
# Keeping this small now means fast Docker builds while you iterate on plumbing.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "C4",   # comprehension simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
