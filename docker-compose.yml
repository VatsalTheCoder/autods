# The full local stack. `docker compose up` gives you six containers:
#
#   postgres  - job and artifact metadata
#   redis     - Celery message broker
#   minio     - S3-compatible object storage (real S3 on AWS)
#   api       - FastAPI backend
#   worker    - Celery worker
#   ui        - Streamlit frontend
#
# The dependency graph is enforced with healthchecks, so `api` does not start
# until Postgres is genuinely accepting queries -- not merely running. Without
# that, the API wins the race on a cold start and crashes on its first query.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autods
      POSTGRES_PASSWORD: autods
      POSTGRES_DB: autods
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autods -d autods"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, browsable at http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once, then exits. Without this the first upload would
  # fail against a bucket that does not exist yet.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/autods-artifacts &&
      echo 'bucket ready'
      "

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://autods:autods@postgres:5432/autods
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: autods-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      # Live code reload: edit a file on your Mac and uvicorn restarts itself.
      - ./app:/code/app
      - ./alembic:/code/alembic
      # Mounted rather than baked into the image, so `make test` sees the
      # tests you just edited and the production image stays free of them.
      - ./tests:/code/tests
      # Mounted so ruff and pytest configuration changes take effect without
      # an image rebuild.
      - ./pyproject.toml:/code/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://autods:autods@postgres:5432/autods
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: autods-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      # Service name, not localhost: inside the Docker network "localhost"
      # would mean the ui container itself.
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/code/ui
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
