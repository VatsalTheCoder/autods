name: CI

# Runs on every push and every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      # Tests needing Postgres or MinIO skip themselves when those are absent,
      # so this runs without services. Section 4 adds service containers here.
      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=term-missing

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Catches links to files that were renamed or never existed.
      - name: Verify relative links in Markdown resolve
        run: |
          fail=0
          for md in $(find . -name '*.md' -not -path './.git/*'); do
            dir=$(dirname "$md")
            targets=$(grep -oE '\]\(([^)#:]+\.md)' "$md" | sed 's/^](//' || true)
            for t in $targets; do
              if [ ! -f "$dir/$t" ]; then
                echo "::error file=$md::Broken link to '$t'"
                fail=1
              fi
            done
          done
          exit $fail
